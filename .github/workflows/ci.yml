name: C/C++ CI

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            flex \
            bison \
            git \
            pkg-config \
            ca-certificates \
            libfl-dev \
            default-jre-headless \
            libgc-dev

      - name: Configure CMake
        run: cmake -B build -S . -DUSE_RARS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build -E e2e --output-on-failure

      - name: E2E tests (o7rc+RARS vs OBNC)
        run: ctest --test-dir build -L e2e --output-on-failure
