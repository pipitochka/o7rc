name: CI All Frontend Configs

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        config:
          - name: "Flex+HandParser"
            flags: "-DUSE_FLEX=ON -DUSE_BISON=OFF -DUSE_HAND_TOKENIZER=OFF -DUSE_HAND_PARSER=ON"
          - name: "HandTokenizer+Bison"
            flags: "-DUSE_FLEX=OFF -DUSE_BISON=ON -DUSE_HAND_TOKENIZER=ON -DUSE_HAND_PARSER=OFF"
          - name: "HandTokenizer+HandParser"
            flags: "-DUSE_FLEX=OFF -DUSE_BISON=OFF -DUSE_HAND_TOKENIZER=ON -DUSE_HAND_PARSER=ON"
          - name: "All"
            flags: "-DUSE_FLEX=ON -DUSE_BISON=ON -DUSE_HAND_TOKENIZER=ON -DUSE_HAND_PARSER=ON"

    name: ${{ matrix.config.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            flex \
            bison \
            git \
            pkg-config \
            ca-certificates \
            libfl-dev \
            default-jre-headless \
            libgc-dev

      - name: Configure CMake
        run: cmake -B build -S . ${{ matrix.config.flags }} -DUSE_RARS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build -E e2e --output-on-failure

      - name: E2E tests (o7rc+RARS vs OBNC)
        run: ctest --test-dir build -L e2e --output-on-failure
